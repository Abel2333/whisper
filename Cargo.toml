[package]
name = "whisper"
version = "0.2.0"
edition = "2024"

[[example]]
name = "basic_agent"
path = "examples/basic_agent.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.99"
async-trait = "0.1.89"
base64 = "0.22.1"
clap = { version = "4.5.48", features = ["derive"] }
config = "0.15.17"
dotenvy = "0.15.7"
flexi_logger = "0.28.0"
futures = "0.3.31"
hex = "0.4.3"
log = "0.4.22"
rand = "0.9.2"
rig-core = { version = "0.21.0", features = ["rmcp"] }
rmcp = { version = "0.6.4", features = [
  "client",
  "transport-child-process",
  "transport-sse-client",
  "transport-sse-client-reqwest",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
serde_toml = "0.0.1"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full"] }
toml = "0.9.7"
